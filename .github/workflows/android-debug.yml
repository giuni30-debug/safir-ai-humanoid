name: Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Safir Humanoid adaptive launcher icon
        shell: bash
        run: |
          set -euo pipefail
          RES="android/app/src/main/res"
          test -s "$RES/drawable-nodpi/safir_launcher_icon.jpg"
          test -s "$RES/drawable/ic_safir_foreground.xml"
          test -s "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          test -s "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          file "$RES/drawable-nodpi/safir_launcher_icon.jpg"

      - name: Restore stable Safir Mars Humanoid Base video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/raw /tmp/safir-base-apk

          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android-debug.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          test -n "$RUN_ID"

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name safir-ai-humanoid-scanner-style-icon-apk \
            --dir /tmp/safir-base-apk

          BASE_APK="$(find /tmp/safir-base-apk -type f -name '*.apk' -print -quit)"
          test -n "$BASE_APK"

          unzip -p "$BASE_APK" res/raw/safir_humanoid_mars.mp4 \
            > android/app/src/main/res/raw/safir_humanoid_mars.mp4

          test -s android/app/src/main/res/raw/safir_humanoid_mars.mp4

      - name: Build debug APK
        run: gradle :android:app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: safir-ai-humanoid-scanner-style-icon-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

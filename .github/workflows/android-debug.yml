name: Android Debug APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Fetch Safir AI icon source
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/giuni30-debug/safir-ai-humanoid/d23987ee3849a44bad647ca2edfc7703d389a661/android/app/src/main/res/drawable-nodpi/safir_launcher_art.jpg' \
            --output android/app/src/main/res/drawable-nodpi/safir_launcher_icon.jpg

      - name: Fetch latest Safir Mars Humanoid Base video
        run: |
          mkdir -p android/app/src/main/res/raw
          curl --fail --location --retry 3 \
            'https://files2.heygen.ai/aws_pacific/avatar_tmp/c9ff2ee1fa774b72867af9af69c824cd/vc4cc91f1dc324d07a9014acc1da87c8b/bac5ec2e661543c6a7c0530571143162.mp4?Expires=1788295323&Signature=qo8ETnPb5DIY5lIS5RgO7vE2Dn-1lgL8SITkCgpPbFOch9csG1DycRpt1RHR~rIaQTAg-aI-4bqzNV7~6v0MLGwANPTqLPq5F-Ap2XW66eZRYxnwmGvX4cBhbPMWDdmlKE71Uo-STGPdQtfx~wsdVi1WMFeLyjTbxP4hX-sFOZDLba4EKtPCNvdGJSOabWY7XG2yq9QV~NhDuz9ULLy5XpEfTGwxS4OetWnzQFghSLgW0vJrEmhcfrOtzTB1MdFbLGNYo5Tl~o99DxeoPhaY6m-jsxLmSThSdGZjJkDiyU7xqa0AT6DVK0TO4u7t5z-i2q~vFJPC4shp6zdJEGVInA__&Key-Pair-Id=K38HBHX5LX3X2H' \
            --output android/app/src/main/res/raw/safir_humanoid_mars.mp4

      - name: Build debug APK
        run: gradle :android:app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafirAI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

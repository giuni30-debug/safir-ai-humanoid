name: Install exact Safir AI launcher icon

on:
  push:
    paths:
      - '.icon-b64/READY'

permissions:
  contents: write

jobs:
  install-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild exact uploaded image bytes
        shell: bash
        run: |
          set -euo pipefail
          cat .icon-b64/part* | base64 --decode > /tmp/safir_launcher_art.jpg
          echo "60ab48b33a1aac7de574568d5407adc105e711144916d4d6281aba4ef228ead5  /tmp/safir_launcher_art.jpg" | sha256sum --check --strict
          mkdir -p android/app/src/main/res/drawable-nodpi
          mv /tmp/safir_launcher_art.jpg android/app/src/main/res/drawable-nodpi/safir_launcher_art.jpg

      - name: Commit exact icon and remove temporary transport files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/res/drawable-nodpi/safir_launcher_art.jpg
          git rm -r .icon-b64
          git rm .github/workflows/install-exact-icon.yml
          git commit -m "Use exact attached Safir AI launcher icon"
          git push
